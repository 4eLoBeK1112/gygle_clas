<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в аккаунт</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #172033;
            --muted: #68738a;
            --line: #dce2ec;
            --surface: #ffffff;
            --accent: #315efb;
            --accent-dark: #2449c9;
            --background: #f1f4fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--background);
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
        }

        .login-card {
            width: min(100%, 430px);
            padding: 44px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 18px 45px rgba(34, 49, 82, 0.12);
        }

        .eyebrow {
            margin: 0 0 12px;
            color: var(--accent);
            font-family: Arial, sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 8vw, 2.8rem);
            line-height: 1;
        }

        .intro {
            margin: 16px 0 30px;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.5;
        }

        form {
            display: grid;
            gap: 18px;
        }

        label {
            display: grid;
            gap: 8px;
            font-family: Arial, sans-serif;
            font-size: 0.88rem;
            font-weight: 700;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--line);
            border-radius: 5px;
            color: var(--ink);
            background: #fbfcfe;
            font: inherit;
            font-family: Arial, sans-serif;
            font-size: 1rem;
        }

        input:focus {
            outline: 3px solid rgba(49, 94, 251, 0.18);
            border-color: var(--accent);
        }

        .options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-family: Arial, sans-serif;
            font-size: 0.85rem;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-weight: 400;
        }

        .remember input {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
        }

        a {
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            padding: 14px 18px;
            border: 0;
            border-radius: 5px;
            color: #fff;
            background: var(--accent);
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 1rem;
            font-weight: 700;
        }

        button:hover {
            background: var(--accent-dark);
        }

        .signup {
            margin: 24px 0 0;
            color: var(--muted);
            font-family: Arial, sans-serif;
            font-size: 0.9rem;
            text-align: center;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }

            .options {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <main class="login-card">
        <p class="eyebrow">Добро пожаловать</p>
        <h1>Вход в аккаунт</h1>
        <p class="intro">Введите свои данные, чтобы продолжить работу.</p>

        <form method="post" action="">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <div role="alert">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}
            <label for="username">
                Имя пользователя
                {{ form.username }}
            </label>

            <label for="password">
                Пароль
                {{ form.password }}
            </label>

            <div class="options">
                <label class="remember" for="remember">
                    <input id="remember" name="remember" type="checkbox">
                    Запомнить меня
                </label>
                <a href="#">Забыли пароль?</a>
            </div>

            <button type="submit">Войти</button>
        </form>

    </main>
</body>
</html>
