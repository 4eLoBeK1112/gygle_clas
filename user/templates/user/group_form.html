<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        :root { --ink: #20232a; --muted: #69707d; --line: #dfe3e8; --surface: #fff; --background: #f6f3ee; --accent: #a34b21; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--background); color: var(--ink); font-family: Arial, sans-serif; }
        main { width: min(100%, 620px); padding: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
        h1 { margin: 0 0 10px; font: 700 2.5rem Georgia, serif; }
        .intro { margin: 0 0 26px; color: var(--muted); }
        form { display: grid; gap: 16px; }
        label { display: grid; gap: 7px; font-weight: 700; }
        input, textarea, select { width: 100%; padding: 11px; border: 1px solid var(--line); border-radius: 5px; background: #fff; font: inherit; }
        .errors { color: #b42318; font-size: .9rem; }
        button { padding: 13px; border: 0; border-radius: 5px; color: #fff; background: var(--accent); cursor: pointer; font-weight: 700; }
        .cancel { color: var(--accent); text-align: center; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <h1>{{ title }}</h1>
        <p class="intro">Группа: {{ group.name }}</p>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {% for field in form %}
                <label for="{{ field.id_for_label }}">{{ field.label }} {{ field }}</label>
                <div class="errors">{{ field.errors }}</div>
            {% endfor %}
            <button type="submit">{{ button }}</button>
            <a class="cancel" href="{% url 'group_detail' group.id %}">Отмена</a>
        </form>
    </main>
</body>
</html>
