<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать группу</title>
    <style>
        :root { --ink: #20232a; --muted: #69707d; --line: #dfe3e8; --surface: #fff; --background: #f6f3ee; --accent: #a34b21; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--background); color: var(--ink); font-family: Arial, sans-serif; }
        main { width: min(100%, 620px); padding: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
        h1 { margin: 0 0 10px; font: 700 2.5rem Georgia, serif; }
        .intro { margin: 0 0 26px; color: var(--muted); }
        form { display: grid; gap: 16px; }
        label { display: grid; gap: 7px; font-weight: 700; }
        input, textarea, select { width: 100%; padding: 11px; border: 1px solid var(--line); border-radius: 5px; background: #fff; font: inherit; }
        select[multiple] { min-height: 150px; }
        .errors { color: #b42318; font-size: .9rem; }
        button { padding: 13px; border: 0; border-radius: 5px; color: #fff; background: var(--accent); cursor: pointer; font-weight: 700; }
        .cancel { color: var(--accent); text-align: center; font-weight: 700; text-decoration: none; }
        @media (max-width: 520px) { main { padding: 24px; } }
    </style>
</head>
<body>
    <main>
        <h1>{% if editing %}Изменить группу{% else %}Создать группу{% endif %}</h1>
        <p class="intro">{% if editing %}Обновите данные группы.{% else %}Добавьте название, преподавателя и студентов группы.{% endif %}</p>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <label for="id_name">Название группы {{ form.name }}</label>
            <div class="errors">{{ form.name.errors }}</div>
            <label for="id_description">Описание {{ form.description }}</label>
            <label for="id_teacher">Преподаватель {{ form.teacher }}</label>
            <label for="id_students">Студенты {{ form.students }}</label>
            <div class="errors">{{ form.students.errors }}</div>
            <button type="submit">{% if editing %}Сохранить изменения{% else %}Создать группу{% endif %}</button>
            <a class="cancel" href="{% url 'student_groups' %}">Отмена</a>
        </form>
    </main>
</body>
</html>
